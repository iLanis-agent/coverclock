<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoverClock - the receipt you forgot had a deadline</title>
<style>
  :root { --bg:#10141a; --panel:#171e27; --line:#2b3644; --text:#f1f5f9; --dim:#93a3b4; --accent:#7dd3fc; --act:#ff8f7a; --soon:#ffcf7a; --safe:#8be0a4; --dead:#5a6470; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 14px 44px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; width:min(640px, 94vw); margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  input, select { background:#0b0f14; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px; }
  label { color:var(--dim); font-size:11px; display:block; margin-bottom:4px; }
  button { background:var(--accent); color:#10141a; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .strip { display:flex; gap:8px; flex-wrap:wrap; }
  .stat { background:#0b0f14; border:1px solid var(--line); border-radius:10px; padding:10px 14px; flex:1; min-width:120px; text-align:center; }
  .stat .n { font-size:22px; font-weight:900; }
  .stat .l { color:var(--dim); font-size:11px; margin-top:2px; }
  .item { background:#0b0f14; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:8px; }
  .item .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .item .nm { font-weight:700; }
  .item .price { color:var(--dim); font-size:13px; }
  .wins { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .win { border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; min-width:150px; }
  .win .k { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.05em; }
  .win .d { font-weight:700; margin-top:2px; }
  .win.act { border-color:var(--act); } .win.act .d { color:var(--act); }
  .win.soon { border-color:var(--soon); } .win.soon .d { color:var(--soon); }
  .win.safe .d { color:var(--safe); }
  .win.expired { opacity:.55; } .win.expired .d { color:var(--dead); }
  .bar { height:4px; background:#1c242e; border-radius:2px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:2px; }
  .del { background:none; border:none; color:var(--dim); cursor:pointer; font-size:12px; margin-top:8px; padding:0; }
  .del:hover { color:var(--act); }
  .empty { color:var(--dim); text-align:center; padding:10px 0; font-size:14px; }
  .chip { font-size:11px; font-weight:700; padding:2px 10px; border-radius:20px; }
  .c-act { background:var(--act); color:#10141a; }
  .c-soon { background:var(--soon); color:#10141a; }
  .c-safe { background:#24414f; color:var(--accent); }
  .c-expired { background:#2a2f36; color:var(--dead); }
  .foot { margin-top:14px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>CoverClock</h1>
<div class="sub">warranties and return windows expire silently. put every purchase on a countdown.</div>

<div class="card">
  <div class="strip">
    <div class="stat"><div class="n" id="s-covered">0</div><div class="l">covered value</div></div>
    <div class="stat"><div class="n" id="s-act">0</div><div class="l">act this week</div></div>
    <div class="stat"><div class="n" id="s-soon">0</div><div class="l">expiring soon</div></div>
    <div class="stat"><div class="n" id="s-live">0</div><div class="l">live warranties</div></div>
  </div>
</div>

<div class="card">
  <h2>Add a purchase</h2>
  <div class="row">
    <div><label>Item</label><input id="i-name" placeholder="e.g. Espresso machine"></div>
    <div><label>Price (optional)</label><input id="i-price" type="number" min="0" step="any" placeholder="350"></div>
    <div><label>Purchased</label><input id="i-date" type="date"></div>
    <div><label>Warranty</label><select id="i-warranty"><option value="0">none</option><option value="6">6 mo</option><option value="12" selected>12 mo</option><option value="24">24 mo</option><option value="36">36 mo</option></select></div>
    <div><label>Return window</label><select id="i-return"><option value="0">none</option><option value="14">14 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select></div>
    <button id="add">Track it</button>
  </div>
</div>

<div class="card">
  <h2>Your coverage</h2>
  <div id="items"><div class="empty">Nothing tracked yet. Add your first purchase above.</div></div>
</div>

<div class="foot"><a href="index.html">&larr; about</a></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var KEY = 'coverclock-v1';
  var items = [];

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) items = s; } catch (e) {}
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function fmtDays(d) {
    if (d < 0) return 'expired ' + (-d) + 'd ago';
    if (d === 0) return 'expires today';
    return d + 'd left';
  }
  var TIER_CHIP = { act: 'act now', soon: 'soon', safe: 'covered', expired: 'expired', none: '-' };

  function render() {
    var now = todayISO();
    var sm = CoverClock.summary(items, now);
    document.getElementById('s-covered').textContent = sm.coveredValue ? '$' + sm.coveredValue.toLocaleString() : '0';
    document.getElementById('s-act').textContent = sm.actCount;
    document.getElementById('s-soon').textContent = sm.soonCount;
    document.getElementById('s-live').textContent = sm.liveWarranties;

    var el = document.getElementById('items');
    if (!items.length) { el.innerHTML = '<div class="empty">Nothing tracked yet. Add your first purchase above.</div>'; return; }
    el.innerHTML = '';
    CoverClock.sortItems(items, now).forEach(function (entry) {
      var it = entry.item, st = entry.st;
      var div = document.createElement('div');
      div.className = 'item';
      var html = '<div class="top"><span class="nm">' + esc(it.name) + '</span>' +
        '<span><span class="chip c-' + st.tier + '">' + TIER_CHIP[st.tier] + '</span>' +
        (it.price ? ' <span class="price">$' + Number(it.price).toLocaleString() + '</span>' : '') + '</span></div><div class="wins">';
      [['ret', 'Return window'], ['warranty', 'Warranty']].forEach(function (kw) {
        var w = st.windows[kw[0]];
        if (!w) return;
        var t = CoverClock.tier(w.daysLeft);
        var total = kw[0] === 'ret' ? it.returnDays : Math.round((new Date(w.deadline) - new Date(it.purchased)) / 86400000);
        var elapsed = Math.min(1, Math.max(0, 1 - w.daysLeft / total));
        var color = t === 'act' ? 'var(--act)' : t === 'soon' ? 'var(--soon)' : t === 'expired' ? 'var(--dead)' : 'var(--safe)';
        html += '<div class="win ' + t + '"><div class="k">' + kw[1] + ' &middot; ' + w.deadline + '</div>' +
          '<div class="d">' + fmtDays(w.daysLeft) + '</div>' +
          '<div class="bar"><i style="width:' + Math.round(elapsed * 100) + '%;background:' + color + '"></i></div></div>';
      });
      html += '</div><button class="del" data-id="' + it.id + '">remove</button>';
      div.innerHTML = html;
      el.appendChild(div);
    });
    el.querySelectorAll('.del').forEach(function (b) {
      b.addEventListener('click', function () {
        items = items.filter(function (x) { return x.id !== b.getAttribute('data-id'); });
        save(); render();
      });
    });
  }

  document.getElementById('add').addEventListener('click', function () {
    var name = document.getElementById('i-name').value.trim();
    var date = document.getElementById('i-date').value;
    if (!name || !date) return;
    items.push({
      id: 'i' + Date.now(),
      name: name,
      price: parseFloat(document.getElementById('i-price').value) || 0,
      purchased: date,
      warrantyMonths: +document.getElementById('i-warranty').value,
      returnDays: +document.getElementById('i-return').value
    });
    document.getElementById('i-name').value = '';
    document.getElementById('i-price').value = '';
    save(); render();
  });

  // test hook
  window.__cc = {
    clear: function () { items = []; save(); render(); },
    add: function (name, price, purchased, warrantyMonths, returnDays) {
      items.push({ id: 'i' + Math.random(), name: name, price: price, purchased: purchased, warrantyMonths: warrantyMonths, returnDays: returnDays });
      save(); render();
    },
    read: function () {
      return {
        names: Array.prototype.map.call(document.querySelectorAll('#items .nm'), function (d) { return d.textContent; }),
        chips: Array.prototype.map.call(document.querySelectorAll('#items .chip'), function (d) { return d.textContent; }),
        wins: Array.prototype.map.call(document.querySelectorAll('#items .win .d'), function (d) { return d.textContent; }),
        covered: document.getElementById('s-covered').textContent,
        act: document.getElementById('s-act').textContent
      };
    }
  };

  document.getElementById('i-date').value = todayISO();
  load();
  render();
})();
</script>
</body>
</html>
